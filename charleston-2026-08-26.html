<!-- ===== AMICUS PASSWORD GATE (start) ===== -->
<style id="amicusGateStyle">
  html.amicus-locked body > *:not(#amicusLock){display:none !important;}
  #amicusLock{position:fixed;inset:0;z-index:99999;background:#0f0f0f;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
  #amicusLock .lock-card{width:min(400px,90vw);text-align:center;padding:40px 32px;border:1px solid rgba(255,255,255,0.12);border-radius:16px;background:#161616;}
  #amicusLock .lock-mark{font-family:'Playfair Display',serif;font-weight:900;font-size:32px;color:#fff;letter-spacing:2px;}
  #amicusLock .lock-sub{color:rgba(255,255,255,0.55);font-size:13px;margin:6px 0 28px;letter-spacing:1px;text-transform:uppercase;}
  #amicusLock input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:#0f0f0f;color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:1px;}
  #amicusLock input:focus{border-color:rgba(255,255,255,0.5);}
  #amicusLock button{width:100%;margin-top:14px;padding:14px 16px;border-radius:10px;border:none;background:#fff;color:#0f0f0f;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
  #amicusLock button:hover{background:#e8e8e8;}
  #amicusLock .lock-err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:18px;}
  #amicusLock .lock-note{color:rgba(255,255,255,0.35);font-size:12px;margin-top:20px;}
  .qty-row{margin-top:10px;font-size:13px;color:#555;}
  .qty-select{margin-left:6px;padding:5px 10px;border-radius:8px;border:1px solid #ccc;font-size:14px;background:white;cursor:pointer;}
  .qty-of{color:#999;font-size:12px;margin-left:4px;}
</style>
<script id="amicusGateScript">
(function(){
  var KEY = 'amicus_auth_v1';
  var HASH = '576998560b830406a1a75b58651422a9d5dd7e09bec82310f52dc3200920a029';
  try { if (localStorage.getItem(KEY) === HASH) return; } catch(e) {}
  document.documentElement.classList.add('amicus-locked');
  async function sha256(str){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }
  function buildLock(){
    var wrap = document.createElement('div');
    wrap.id = 'amicusLock';
    wrap.innerHTML =
      '<div class="lock-card">' +
        '<div class="lock-mark">AMICUS</div>' +
        '<div class="lock-sub">Team Access Only</div>' +
        '<input type="password" id="amicusPw" placeholder="Enter team password" autocomplete="current-password"/>' +
        '<button id="amicusGo">Unlock</button>' +
        '<div class="lock-err" id="amicusErr"></div>' +
        '<div class="lock-note">This device will stay signed in.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var input = wrap.querySelector('#amicusPw');
    var err = wrap.querySelector('#amicusErr');
    async function attempt(){
      var val = input.value.trim();
      if (!val) return;
      var h;
      try { h = await sha256(val); }
      catch(e){ err.textContent = 'Unlock unavailable in this browser.'; return; }
      if (h === HASH){
        try { localStorage.setItem(KEY, HASH); } catch(e) {}
        document.documentElement.classList.remove('amicus-locked');
        wrap.remove();
      } else {
        err.textContent = 'Incorrect password. Please try again.';
        input.value = '';
        input.focus();
      }
    }
    wrap.querySelector('#amicusGo').addEventListener('click', attempt);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') attempt(); });
    setTimeout(function(){ input.focus(); }, 50);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildLock);
  } else { buildLock(); }
})();
</script>
<!-- ===== AMICUS PASSWORD GATE (end) ===== -->

    .tabs{max-width:900px;margin:0 auto;display:flex;}
    .tab{background:transparent;color:rgba(255,255,255,0.5);border:none;padding:13px 16px;font-size:13px;font-weight:400;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
    .tab.active{background:#F7F5F2;font-weight:700;}
    .content{max-width:900px;margin:0 auto;padding:28px 32px;}
    .prog-wrap{margin-bottom:24px;}
    .prog-meta{display:flex;justify-content:space-between;font-size:13px;color:#666;margin-bottom:7px;}
    .prog-track{height:6px;background:#E0E0E0;border-radius:99px;overflow:hidden;}
    .prog-fill{height:100%;border-radius:99px;transition:width 0.4s ease;}
    .tasks{display:flex;flex-direction:column;gap:11px;}
    .task-card{background:white;border-radius:12px;padding:15px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;transition:opacity 0.2s,box-shadow 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
    .task-card.done{opacity:0.42;box-shadow:none;}
    .checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #DDD;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:white;transition:all 0.2s;}
    .checkbox .ck{display:none;color:white;font-size:12px;font-weight:700;}
    .done .checkbox .ck{display:block;}
    .task-icon{font-size:21px;flex-shrink:0;margin-top:1px;}
    .task-body{flex:1;}
    .plat-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
    .task-title{font-size:15px;font-weight:600;color:#1a1a1a;}
    .done .task-title{text-decoration:line-through;}
    .task-detail{font-size:13px;color:#888;line-height:1.5;margin-top:3px;}
    .tip{margin-top:24px;border-radius:12px;padding:16px 18px;}
    .tip-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px;}
    .tip ul{padding-left:16px;font-size:13px;color:#555;line-height:2;}
    .goals{display:flex;flex-direction:column;gap:14px;}
    .gcard{background:white;border-radius:14px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
    .gcard-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
    .gcard-head .gi{font-size:20px;}
    .gcard-head .gn{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
    .gitems{display:flex;flex-direction:column;gap:16px;}
    .grow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px;}
    .glabel{font-size:14px;font-weight:600;color:#1a1a1a;flex:1;}
    .gcontrols{display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .gcount{font-size:13px;font-weight:700;color:#333;min-width:90px;text-align:center;}
    .gbtn{width:27px;height:27px;border-radius:7px;border:1px solid #E0E0E0;background:white;cursor:pointer;font-size:15px;font-weight:700;color:#666;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;line-height:1;flex-shrink:0;}

    table.mtable{border-collapse:collapse;width:100%;min-width:820px;font-size:13px;}
    table.mtable th{background:#22303C;color:#cfd8dc;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:10px 10px;text-align:left;white-space:nowrap;}
    table.mtable td{border-top:1px solid #eee;padding:8px 10px;vertical-align:middle;color:#333;}
    table.mtable tr.mrow.overdue td{background:#FFF6F6;}
    table.mtable tr.mrow.posted td{background:#F6FBF6;}
    .m-input{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;font-size:13px;font-family:'DM Sans',sans-serif;color:#1a1a1a;}
    .m-input:hover{border-color:#e2e2e2;}
    .m-input:focus{border-color:#90caf9;outline:none;background:#fff;}
    .m-input[readonly]{cursor:default;}
    .m-link{color:#1565C0;font-weight:700;text-decoration:none;font-size:12px;white-space:nowrap;}
    .m-status{width:24px;height:24px;border-radius:6px;border:2px solid #ddd;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;user-select:none;}
    .m-status.on{background:#2E7D32;border-color:#2E7D32;}
    .m-status.locked{cursor:not-allowed;opacity:.65;}
    .m-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;}
    .badge-over{background:#C62828;color:#fff;}
    .badge-ready{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;}
    .badge-wait{background:#FFF3E0;color:#E65100;border:1px solid #FFCC80;}

    .m-add{margin-top:8px;background:#fff;border:1px dashed #cfd8dc;color:#607D8B;font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif;}
    .m-add:hover{border-color:#90a4ae;color:#455A64;}
    .type-select{border:1px solid #ddd;border-radius:6px;padding:4px 6px;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;}
    /* collapsible Courtney section on day tabs */
    .courtney-sec{margin-top:22px;border:1px solid #E3E7D3;border-radius:12px;background:#FBFCF6;overflow:hidden;}

    .cs-title{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#6b7a3d;}
    .cs-count{margin-left:auto;font-size:12px;color:#8a9a5b;font-weight:700;}
    .cs-body{padding:0 14px 14px;}

    .header{background:linear-gradient(135deg,#3a0e1c 0%,#5f1730 55%,#7a1f3d 100%);}
    .tabs-bar{background:#2e0b16;}
    .tab.active{color:#5f1730;}
  </style>
</head>

function goalDonut(pct,color,atTarget){
  var r=15,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<div style="position:relative;width:46px;height:46px;flex-shrink:0;"><svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate(-90deg);"><circle cx="23" cy="23" r="'+r+'" fill="none" stroke="#ECECEC" stroke-width="5"/><circle cx="23" cy="23" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" style="transition:stroke-dashoffset .45s ease"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:'+(atTarget?color:'#666')+';">'+(atTarget?'\u2713':pct+'%')+'</div></div>';
}
function renderGoalBar(cat,g,rawVal,key,isManual){
  const atTarget=rawVal>=g.target;
  const pct=atTarget?100:Math.min(99,Math.round((rawVal/g.target)*100));
  const bar=atTarget?'linear-gradient(90deg,'+cat.color+','+cat.color+'cc)':'linear-gradient(90deg,'+cat.color+'99,'+cat.color+')';
  let controls="";
  if(isManual){ controls='<button class="gbtn" onclick="adjManual(\''+key+'\',-1)">−</button><span class="gcount" style="'+(atTarget?'color:'+cat.color:'')+'">'+rawVal+' / '+g.target+' '+g.unit+'</span><button class="gbtn" onclick="adjManual(\''+key+'\',1)" style="'+(atTarget?'background:'+cat.color+';color:white;border-color:'+cat.color:'')+'">+</button>'+(atTarget?'<span style="font-size:16px">✅</span>':''); }
  else if(atTarget){ controls='<button class="gbtn" onclick="adjBonus(\''+key+'\',-1)">−</button><span class="gcount" style="color:'+cat.color+'">'+rawVal+' / '+g.target+' '+g.unit+'</span><button class="gbtn" onclick="adjBonus(\''+key+'\',1)" style="background:'+cat.color+';color:white;border-color:'+cat.color+'">+</button><span style="font-size:16px">✅</span>'; }
  else { controls='<span class="gcount">'+rawVal+' / '+g.target+' '+g.unit+'</span>'; }
  return '<div class="growwrap" style="display:flex;align-items:center;gap:14px;"><div style="flex:1;min-width:0;"><div class="grow-top"><span class="glabel">'+g.label+'</span><div class="gcontrols">'+controls+'</div></div><div class="gtrack"><div class="gfill" style="width:'+pct+'%;background:'+bar+'"></div></div><div class="gpct'+(atTarget?' reached':'')+'" style="'+(atTarget?'color:'+cat.color:'')+'">'+(atTarget?'Goal reached! 🎉':pct+'%')+'</div></div>'+goalDonut(pct,cat.color,atTarget)+'</div>';
}

  let head='<div class="cs-head'+(open?' open':'')+'" onclick="toggleCollapse(\'day-'+day.iso+'\')"><span class="cs-caret">▶</span><span class="cs-title">🎬 Courtney — Media</span><span class="cs-count">'+items.length+' item'+(items.length===1?'':'s')+(overCnt?' · <span style=\"color:#C62828\">'+overCnt+' overdue</span>':'')+'</span></div>';
  let body='';
  if(open){
    if(items.length===0){ body='<div style="color:#8a9a5b;font-size:13px;padding:6px 2px;">Nothing scheduled for Courtney '+(isToday?'today':'this day')+'.</div>'; }
    else { body='<div class="mtable-wrap" style="box-shadow:none;">'+mediaTable(items,day.iso,true)+'</div>'; }
    if(canEditMedia()){ body+='<button class="m-add" onclick="mediaAdd(\''+day.iso+'\')">+ Add idea for '+day.day+'</button>'; }
    else { body+='<div style="margin-top:8px;font-size:12px;color:#8a9a5b;">🔒 View only. <a href="#" onclick="unlockCourtney();return false;" style="color:#6b7a3d;font-weight:700;">Unlock to edit (Courtney / Jake)</a></div>'; }
  }
  return '<div class="courtney-sec">'+head+(open?'<div class="cs-body">'+body+'</div>':'')+'</div>';
}

/* ---------- full Media tab ---------- */
function renderMedia(){
  const editable=canEditMedia();
  const over=overdueItems();
  let html='<div class="sync-banner">🔴 Live — changes sync instantly for Courtney & Jake</div>';
  html+='<div class="media-head"><div class="media-title">Courtney — Media Tracker</div><div class="media-legend"><span class="type-pill type-video">Video</span><span class="type-pill type-photo">Photo</span><span class="type-pill type-flyer">Flyer</span></div></div>';

  // edit bar
  html+='<div class="edit-bar">';
  if(editable){ html+='<button class="ebtn ebtn-on">✏️ Edit mode on — '+(jakeMode?'Jake':'Courtney')+'</button><span style="font-size:12px;color:#777">Tap any field to change it. Everything saves live.</span>'; }
  else { html+='<button class="ebtn ebtn-lock" onclick="unlockCourtney()">🔒 Unlock to edit</button><span style="font-size:12px;color:#777">Courtney &amp; Jake only.</span>'; }
  if(over.length){ html+='<span class="overdue-pill" style="margin-left:auto">⚠ '+over.length+' overdue</span>'; }
  html+='</div>';

  // progress
  const all=mediaList().filter(it=>it.date>='2026-08-19'&&it.date<='2026-08-25');
  const posted=all.filter(it=>it.posted).length;
  const pct=all.length?Math.round(posted/all.length*100):0;
  html+='<div class="prog-wrap"><div class="prog-meta"><span>'+posted+' of '+all.length+' posted this week</span><span style="color:'+ACCENT+';font-weight:700">'+pct+'%</span></div><div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:'+ACCENT+'"></div></div></div>';

  // overdue group (carried forward) — collapsible
  if(over.length){
    const oOpen=collapse['media-over']!==true; // default open
    html+='<div class="day-group"><div class="dg-head overdue" style="cursor:pointer;user-select:none;" onclick="toggleCollapse(\'media-over\')"><span style="display:inline-block;transition:transform .2s;transform:rotate('+(oOpen?90:0)+'deg)">▶</span>&nbsp; ⚠ Overdue — needs attention · '+over.length+'</div>'+(oOpen?'<div class="mtable-wrap">'+mediaTable(over,null,false)+'</div>':'')+'</div>';
  }
  // per-day groups Wed→Tue
  schedule.filter(s=>s.iso).forEach(s=>{
    let items=mediaList().filter(it=>it.date===s.iso && !isOverdue(it));
    const isToday=s.iso===DEMO_TODAY;
    if(items.length===0 && !editable) return;
    html+='<div class="day-group"><div class="dg-head'+(isToday?' today':'')+'">'+s.day+(isToday?' · TODAY':'')+'</div>';
    if(items.length){ html+='<div class="mtable-wrap">'+mediaTable(items,s.iso,false)+'</div>'; }
    else { html+='<div style="color:#bbb;font-size:13px;padding:4px 2px;">— no items —</div>'; }
    if(editable){ html+='<button class="m-add" onclick="mediaAdd(\''+s.iso+'\')">+ Add idea for '+s.day+'</button>'; }
    html+='</div>';
  });
  return html;
}

function mediaTable(items,iso,compact){
  const editable=canEditMedia();
  let h='<table class="mtable"><thead><tr>'+
    '<th>Idea</th><th>Type</th><th>Media link</th><th>Gather?</th><th>Edit</th><th>Story / PIN</th><th>Posted / Sched.</th><th>OneDrive?</th><th>OneDrive link</th><th>Notes</th><th>Monday?</th>'+(editable?'<th></th>':'')+'</tr></thead><tbody>';
  items.forEach(it=>{
    const over=isOverdue(it);
    const cls='mrow'+(over?' overdue':'')+(it.posted?' posted':'');
    let badges='';
    if(over) badges+='<span class="m-badge badge-over">OVERDUE</span>';
    const title = editable ? '<input class="m-input" style="font-weight:700" value="'+esc(it.title)+'" onchange="mediaSet(\''+it.id+'\',\'title\',this.value)">'
                           : '<span style="font-weight:700">'+esc(it.title)+'</span>';
    const type = editable ? '<select class="type-select type-'+it.type+'" onchange="mediaType(\''+it.id+'\',this.value)"><option value="video"'+(it.type==='video'?' selected':'')+'>Video</option><option value="photo"'+(it.type==='photo'?' selected':'')+'>Photo</option><option value="flyer"'+(it.type==='flyer'?' selected':'')+'>Flyer</option></select>'
                          : '<span class="type-pill type-'+it.type+'">'+it.type.charAt(0).toUpperCase()+it.type.slice(1)+'</span>';
    const mlink = editable ? '<input class="m-input" placeholder="https://…" value="'+esc(it.mediaLink)+'" onchange="mediaSet(\''+it.id+'\',\'mediaLink\',this.value)">'
                           : (it.mediaLink?'<a class="m-link" href="'+esc(it.mediaLink)+'" target="_blank" rel="noopener">Open ↗</a>':'<span style="color:#ccc">—</span>');
    const dlink = editable ? '<input class="m-input" placeholder="OneDrive…" value="'+esc(it.oneDrive)+'" onchange="mediaSet(\''+it.id+'\',\'oneDrive\',this.value)">'
                           : (it.oneDrive?'<a class="m-link" href="'+esc(it.oneDrive)+'" target="_blank" rel="noopener">Folder ↗</a>':'<span style="color:#ccc">—</span>');
    const notes = editable ? '<input class="m-input" value="'+esc(it.notes)+'" onchange="mediaSet(\''+it.id+'\',\'notes\',this.value)">'
                           : '<span style="color:#666">'+esc(it.notes)+'</span>';
    h+='<tr class="'+cls+'"><td style="min-width:200px">'+title+badges+'</td><td>'+type+'</td><td style="min-width:110px">'+mlink+'</td>'+
       '<td style="min-width:120px">'+gatherCell(it)+'</td>'+
       '<td>'+statusCell(it,'editDone')+'</td><td>'+statusCell(it,'storyPin')+'</td><td>'+statusCell(it,'posted')+'</td><td>'+statusCell(it,'oneDriveDone')+'</td>'+
       '<td style="min-width:110px">'+dlink+'</td><td style="min-width:150px">'+notes+'</td>'+
       '<td>'+statusCell(it,'monday')+'</td>'+
       (editable?'<td><button class="m-del" title="Archive" onclick="mediaDelete(\''+it.id+'\')">🗑</button></td>':'')+'</tr>';
  });
  h+='</tbody></table>';
  return h;
}
function statusCell(it,field){
  const on=!!it[field];
  if(canEditMedia()){ return '<span class="m-status'+(on?' on':'')+'" onclick="mediaToggle(\''+it.id+'\',\''+field+'\')">'+(on?'✓':'')+'</span>'; }
  return '<span class="m-status'+(on?' on':'')+' locked">'+(on?'✓':'')+'</span>';
}
// Gather column: Courtney flips "needs gather"; market flips "gathered" on their day tab; status relays both ways.
function gatherCell(it){
  const editable=canEditMedia();
  const on=!!it.gathered;
  const box = editable
    ? '<span class="m-status'+(on?' on':'')+'" title="Check when the media has been gathered" onclick="mediaToggle(\''+it.id+'\',\'gathered\')">'+(on?'✓':'')+'</span>'
    : '<span class="m-status'+(on?' on':'')+' locked">'+(on?'✓':'')+'</span>';
  const badge = on ? '<span class="m-badge badge-ready">✓ GATHERED</span>' : '<span class="m-badge badge-wait">⏳ WAITING</span>';
  return '<span style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;">'+box+badge+'</span>';
}

/* ---------- actions ---------- */
function toggle(key){ checked[key]=!checked[key]; if(!checked[key]) delete checked[key]; saveState(); }
function toggleGathered(id){ if(!media[id]) return; media[id].gathered=!media[id].gathered; saveMedia(); render(); }
function adjManual(key,d){ manualGoals[key]=Math.max(0,(manualGoals[key]||0)+d); saveState(); }
function adjBonus(key,d){ manualBonus[key]=Math.max(0,(manualBonus[key]||0)+d); saveState(); }
function setManual(goalKey,val){ manualGoals[goalKey]=parseInt(val)||0; saveState(); render(); }
function setLink(key,val){ val=(val||'').trim(); if(val){taskLinks[key]=val;} else {delete taskLinks[key];} saveState(); render(); }
function toggleCollapse(k){ collapse[k]=!collapse[k]; try{localStorage.setItem('amicus_media_collapse',JSON.stringify(collapse));}catch(e){} render(); }

function mediaSet(id,field,val){ if(!canEditMedia()||!media[id]) return; media[id][field]=(val||'').trim(); saveMedia(); }
function mediaToggle(id,field){ if(!canEditMedia()||!media[id]) return; media[id][field]=!media[id][field]; saveMedia(); render(); }
function mediaType(id,val){ if(!canEditMedia()||!media[id]) return; media[id].type=val; saveMedia(); render(); }
function mediaAdd(iso){ if(!canEditMedia()) return; const id='m'+Date.now(); media[id]={id:id,title:"New idea",type:"video",date:iso,mediaLink:"",oneDrive:"",editDone:false,storyPin:false,posted:false,oneDriveDone:false,needsGather:false,gathered:false,monday:false,notes:""}; saveMedia(); render(); }
function mediaDelete(id){ if(!canEditMedia()||!media[id]) return; if(!confirm('Archive this item? It will be hidden but kept in the database.')) return; media[id].archived=true; saveMedia(); render(); }

async function unlockCourtney(){
  const pw=prompt("Courtney / Jake password to edit media:");
  if(!pw) return;
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw.trim()));
    const h=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    if(h===COURTNEY_HASH){ courtneyMode=true; try{localStorage.setItem('amicus_courtney_v1',COURTNEY_HASH);}catch(e){} render(); }
    else if(h===JAKE_HASH){ jakeMode=true; try{localStorage.setItem('amicus_jake_v1',JAKE_HASH);}catch(e){} render(); }
    else alert('Incorrect password.');
  }catch(e){ alert('Unlock not available in this browser.'); }
}

/* ---------- market donuts / jake verify / confetti (unchanged engine) ---------- */
function goalTargetFor(gk){ for(var i=0;i<goalCategories.length;i++){var cat=goalCategories[i];for(var j=0;j<cat.goals.length;j++){if(cat.platform+'|'+cat.goals[j].label===gk)return cat.goals[j].target||1;}} return 1; }
function taskPct(t,key){ if(t.qtyGoal){var gk=safeKey(t.qtyGoal);var cur=manualGoals[gk]||0;var mx=t.qtyMax||1;return Math.min(100,Math.round(cur/mx*100));} if(t.goalKey){var counts=computeAutoGoals();var done=(counts[t.goalKey]||0);var tgt=goalTargetFor(t.goalKey);return Math.min(100,Math.round(done/tgt*100));} return checked[key]?100:0; }
function taskDonut(t,key,c){ var p=taskPct(t,key); return '<div style="margin-left:auto;align-self:center;padding-left:8px;">'+goalDonut(p,c,p>=100)+'</div>'; }
function jakeVerifyCtrl(key){
  var q=String.fromCharCode(39); var ver=!!taskVerify[key];
  var box='<span style="width:18px;height:18px;border-radius:5px;border:2px solid '+(ver?'#2e7d32':(jakeMode?'#bbb':'#ddd'))+';background:'+(ver?'#2e7d32':(jakeMode?'#fff':'#f3f3f3'))+';color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;">'+(ver?'\u2713':'')+'</span>';
  var label='<b style="font-weight:800;color:'+(ver?'#2e7d32':(jakeMode?'#777':'#aaa'))+';">J</b>';
  if(jakeMode){ return '<span onclick="event.stopPropagation();setVerify('+q+key+q+')" title="Jake: mark as seen / done" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;">'+box+label+'</span>'; }
  return '<span title="Only Jake can check this" style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap;">'+box+label+'</span>';
}
function setVerify(key){ if(!jakeMode) return; if(taskVerify[key]) delete taskVerify[key]; else taskVerify[key]=true; saveState(); render(); }
var allDoneState={};
function dropConfetti(){ var host=document.getElementById('confettiHost'); if(!host){host=document.createElement('div');host.id='confettiHost';host.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden;';document.body.appendChild(host);} var tb=document.querySelector('.tabs-bar');var startY=tb?Math.round(tb.getBoundingClientRect().bottom):60;var colors=['#4CAF50','#81C784','#FFD54F','#FFFFFF','#2E7D32',ACCENT];for(var i=0;i<90;i++){var d=document.createElement('div');var size=6+Math.random()*8;var col=colors[Math.floor(Math.random()*colors.length)];var dur=2200+Math.random()*1600,delay=Math.random()*250,rot=Math.random()*360,xdrift=Math.random()*160-80;d.style.cssText='position:absolute;top:'+startY+'px;left:'+(Math.random()*100)+'vw;width:'+size+'px;height:'+(size*0.5)+'px;background:'+col+';border-radius:1px;';host.appendChild(d);var anim=d.animate([{transform:'translate(0,0) rotate('+rot+'deg)',opacity:1},{transform:'translate('+xdrift+'px,'+(window.innerHeight+40)+'px) rotate('+(rot+720)+'deg)',opacity:1,offset:0.85},{transform:'translate('+xdrift+'px,'+(window.innerHeight+90)+'px) rotate('+(rot+800)+'deg)',opacity:0}],{duration:dur,delay:delay,easing:'cubic-bezier(.22,.6,.36,1)',fill:'forwards'});anim.onfinish=(function(el){return function(){el.remove();};})(d);} setTimeout(function(){if(host)host.innerHTML='';},4400); }
function updateAllDoneGlow(on){ var g=document.getElementById('allDoneGlow'); if(!g){g=document.createElement('div');g.id='allDoneGlow';g.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9990;opacity:0;transition:opacity 1.1s ease;background:rgba(76,175,80,0.09);';document.body.appendChild(g);} var prev=allDoneState[activeDay];var justDone=(prev!==undefined&&!prev&&on);allDoneState[activeDay]=on;if(justDone){dropConfetti();var d=activeDay;setTimeout(function(){if(activeDay===d)g.style.opacity='1';},450);}else{g.style.opacity=on?'1':'0';} }

initFirebase();
</script>
