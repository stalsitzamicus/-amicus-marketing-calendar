<style id="amicusGateStyle">
  html.amicus-locked body > *:not(#amicusLock){display:none !important;}
  #amicusLock{position:fixed;inset:0;z-index:99999;background:#0f0f0f;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
  #amicusLock .lock-card{width:min(400px,90vw);text-align:center;padding:40px 32px;border:1px solid rgba(255,255,255,0.12);border-radius:16px;background:#161616;}
  #amicusLock .lock-mark{font-family:'Playfair Display',serif;font-weight:900;font-size:32px;color:#fff;letter-spacing:2px;}
  #amicusLock .lock-sub{color:rgba(255,255,255,0.55);font-size:13px;margin:6px 0 28px;letter-spacing:1px;text-transform:uppercase;}
  #amicusLock input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:#0f0f0f;color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:1px;}
  #amicusLock input:focus{border-color:rgba(255,255,255,0.5);}
  #amicusLock button{width:100%;margin-top:14px;padding:14px 16px;border-radius:10px;border:none;background:#fff;color:#0f0f0f;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
  #amicusLock button:hover{background:#e8e8e8;}
  #amicusLock .lock-err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:18px;}
  #amicusLock .lock-note{color:rgba(255,255,255,0.35);font-size:12px;margin-top:20px;}
  .qty-row{margin-top:10px;font-size:13px;color:#555;}
  .qty-select{margin-left:6px;padding:5px 10px;border-radius:8px;border:1px solid #ccc;font-size:14px;background:white;cursor:pointer;}
  .qty-of{color:#999;font-size:12px;margin-left:4px;}
</style>
<script id="amicusGateScript">
(function(){
  var KEY = 'amicus_auth_v1';
  var HASH = '576998560b830406a1a75b58651422a9d5dd7e09bec82310f52dc3200920a029';
  try { if (localStorage.getItem(KEY) === HASH) return; } catch(e) {}
  document.documentElement.classList.add('amicus-locked');
  async function sha256(str){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }
  function buildLock(){
    var wrap = document.createElement('div');
    wrap.id = 'amicusLock';
    wrap.innerHTML =
      '<div class="lock-card">' +
        '<div class="lock-mark">AMICUS</div>' +
        '<div class="lock-sub">Team Access Only</div>' +
        '<input type="password" id="amicusPw" placeholder="Enter team password" autocomplete="current-password"/>' +
        '<button id="amicusGo">Unlock</button>' +
        '<div class="lock-err" id="amicusErr"></div>' +
        '<div class="lock-note">This device will stay signed in.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var input = wrap.querySelector('#amicusPw');
    var err = wrap.querySelector('#amicusErr');
    async function attempt(){
      var val = input.value.trim();
      if (!val) return;
      var h;
      try { h = await sha256(val); }
      catch(e){ err.textContent = 'Unlock unavailable in this browser.'; return; }
      if (h === HASH){
        try { localStorage.setItem(KEY, HASH); } catch(e) {}
        document.documentElement.classList.remove('amicus-locked');
        wrap.remove();
      } else {
        err.textContent = 'Incorrect password. Please try again.';
        input.value = '';
        input.focus();
      }
    }
    wrap.querySelector('#amicusGo').addEventListener('click', attempt);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') attempt(); });
    setTimeout(function(){ input.focus(); }, 50);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildLock);
  } else { buildLock(); }
})();
</script>

function goalDonut(pct,color,atTarget){

}

/* ---------- actions ---------- */
function toggle(key){ checked[key]=!checked[key]; if(!checked[key]) delete checked[key]; saveState(); }
function toggleGather(c){ gather[c]=!gather[c]; if(!gather[c]) delete gather[c]; saveState(); }
function adjManual(key,d){ manualGoals[key]=Math.max(0,(manualGoals[key]||0)+d); saveState(); }
function adjBonus(key,d){ manualBonus[key]=Math.max(0,(manualBonus[key]||0)+d); saveState(); }
function setManual(goalKey,val){ manualGoals[goalKey]=parseInt(val)||0; saveState(); render(); }
function setLink(key,val){ val=(val||'').trim(); if(val){taskLinks[key]=val;} else {delete taskLinks[key];} saveState(); render(); }
function toggleCollapse(k){ collapse[k]=!collapse[k]; try{localStorage.setItem('amicus_media_collapse',JSON.stringify(collapse));}catch(e){} render(); }

function mediaSet(id,field,val){ if(!canEditMedia()||!media[id]) return; media[id][field]=(val||'').trim(); saveState(); }
function mediaToggle(id,field){ if(!canEditMedia()||!media[id]) return; media[id][field]=!media[id][field]; saveState(); render(); }
function mediaType(id,val){ if(!canEditMedia()||!media[id]) return; media[id].type=val; saveState(); render(); }
function mediaAdd(iso){ if(!canEditMedia()) return; const id='m'+Date.now(); media[id]={id:id,title:"New idea",type:"video",date:iso,mediaLink:"",oneDrive:"",editDone:false,storyPin:false,posted:false,oneDriveDone:false,notes:"",campaign:""}; saveState(); render(); }
function mediaDelete(id){ if(!canEditMedia()||!media[id]) return; if(!confirm('Archive this item? It will be hidden but kept in the database.')) return; media[id].archived=true; saveState(); render(); }

async function unlockCourtney(){
  const pw=prompt("Courtney / Jake password to edit media:");
  if(!pw) return;
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw.trim()));
    const h=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    if(h===COURTNEY_HASH){ courtneyMode=true; try{localStorage.setItem('amicus_courtney_v1',COURTNEY_HASH);}catch(e){} render(); }
    else if(h===JAKE_HASH){ jakeMode=true; try{localStorage.setItem('amicus_jake_v1',JAKE_HASH);}catch(e){} render(); }
    else alert('Incorrect password.');
  }catch(e){ alert('Unlock not available in this browser.'); }
}

function goalTargetFor(gk){ for(var i=0;i<goalCategories.length;i++){var cat=goalCategories[i];for(var j=0;j<cat.goals.length;j++){if(cat.platform+'|'+cat.goals[j].label===gk)return cat.goals[j].target||1;}} return 1; }
function taskPct(t,key){ if(t.qtyGoal){var gk=safeKey(t.qtyGoal);var cur=manualGoals[gk]||0;var mx=t.qtyMax||1;return Math.min(100,Math.round(cur/mx*100));} if(t.goalKey){var counts=computeAutoGoals();var done=(counts[t.goalKey]||0);var tgt=goalTargetFor(t.goalKey);return Math.min(100,Math.round(done/tgt*100));} if(t.isGather) return gather[t.campaign]?100:0; return checked[key]?100:0; }
function taskDonut(t,key,c){ var p=taskPct(t,key); return '<div style="margin-left:auto;align-self:center;padding-left:8px;">'+goalDonut(p,c,p>=100)+'</div>'; }
function jakeVerifyCtrl(key){
  var q=String.fromCharCode(39); var ver=!!taskVerify[key];
  var box='<span style="width:18px;height:18px;border-radius:5px;border:2px solid '+(ver?'#2e7d32':(jakeMode?'#bbb':'#ddd'))+';background:'+(ver?'#2e7d32':(jakeMode?'#fff':'#f3f3f3'))+';color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;">'+(ver?'\u2713':'')+'</span>';
  var label='<b style="font-weight:800;color:'+(ver?'#2e7d32':(jakeMode?'#777':'#aaa'))+';">J</b>';
  if(jakeMode){ return '<span onclick="event.stopPropagation();setVerify('+q+key+q+')" title="Jake: mark as seen / done" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;">'+box+label+'</span>'; }
  return '<span title="Only Jake can check this" style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap;">'+box+label+'</span>';
}
function setVerify(key){ if(!jakeMode) return; if(taskVerify[key]) delete taskVerify[key]; else taskVerify[key]=true; saveState(); render(); }
var allDoneState={};
function dropConfetti(){ var host=document.getElementById('confettiHost'); if(!host){host=document.createElement('div');host.id='confettiHost';host.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden;';document.body.appendChild(host);} var tb=document.querySelector('.tabs-bar');var startY=tb?Math.round(tb.getBoundingClientRect().bottom):60;var colors=['#4CAF50','#81C784','#FFD54F','#FFFFFF','#2E7D32',ACCENT];for(var i=0;i<90;i++){var d=document.createElement('div');var size=6+Math.random()*8;var col=colors[Math.floor(Math.random()*colors.length)];var dur=2200+Math.random()*1600,delay=Math.random()*250,rot=Math.random()*360,xdrift=Math.random()*160-80;d.style.cssText='position:absolute;top:'+startY+'px;left:'+(Math.random()*100)+'vw;width:'+size+'px;height:'+(size*0.5)+'px;background:'+col+';border-radius:1px;';host.appendChild(d);var anim=d.animate([{transform:'translate(0,0) rotate('+rot+'deg)',opacity:1},{transform:'translate('+xdrift+'px,'+(window.innerHeight+40)+'px) rotate('+(rot+720)+'deg)',opacity:1,offset:0.85},{transform:'translate('+xdrift+'px,'+(window.innerHeight+90)+'px) rotate('+(rot+800)+'deg)',opacity:0}],{duration:dur,delay:delay,easing:'cubic-bezier(.22,.6,.36,1)',fill:'forwards'});anim.onfinish=(function(el){return function(){el.remove();};})(d);} setTimeout(function(){if(host)host.innerHTML='';},4400); }
function updateAllDoneGlow(on){ var g=document.getElementById('allDoneGlow'); if(!g){g=document.createElement('div');g.id='allDoneGlow';g.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9990;opacity:0;transition:opacity 1.1s ease;background:rgba(76,175,80,0.09);';document.body.appendChild(g);} var prev=allDoneState[activeDay];var justDone=(prev!==undefined&&!prev&&on);allDoneState[activeDay]=on;if(justDone){dropConfetti();var d=activeDay;setTimeout(function(){if(activeDay===d)g.style.opacity='1';},450);}else{g.style.opacity=on?'1':'0';} }

initFirebase();
