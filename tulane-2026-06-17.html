<!-- ===== AMICUS PASSWORD GATE (start) ===== -->
<style id="amicusGateStyle">
  html.amicus-locked body > *:not(#amicusLock){display:none !important;}
  #amicusLock{position:fixed;inset:0;z-index:99999;background:#0f0f0f;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
  #amicusLock .lock-card{width:min(400px,90vw);text-align:center;padding:40px 32px;border:1px solid rgba(255,255,255,0.12);border-radius:16px;background:#161616;}
  #amicusLock .lock-mark{font-family:'Playfair Display',serif;font-weight:900;font-size:32px;color:#fff;letter-spacing:2px;}
  #amicusLock .lock-sub{color:rgba(255,255,255,0.55);font-size:13px;margin:6px 0 28px;letter-spacing:1px;text-transform:uppercase;}
  #amicusLock input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:#0f0f0f;color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:1px;}
  #amicusLock input:focus{border-color:rgba(255,255,255,0.5);}
  #amicusLock button{width:100%;margin-top:14px;padding:14px 16px;border-radius:10px;border:none;background:#fff;color:#0f0f0f;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
  #amicusLock button:hover{background:#e8e8e8;}
  #amicusLock .lock-err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:18px;}
  #amicusLock .lock-note{color:rgba(255,255,255,0.35);font-size:12px;margin-top:20px;}
</style>
<script id="amicusGateScript">
(function(){
  var KEY = 'amicus_auth_v1';
  var HASH = '576998560b830406a1a75b58651422a9d5dd7e09bec82310f52dc3200920a029';

  // Already unlocked on this device? Let the page load normally.
  try { if (localStorage.getItem(KEY) === HASH) return; } catch(e) {}

  document.documentElement.classList.add('amicus-locked');

  async function sha256(str){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }

  function buildLock(){
    var wrap = document.createElement('div');
    wrap.id = 'amicusLock';
    wrap.innerHTML =
      '<div class="lock-card">' +
        '<div class="lock-mark">AMICUS</div>' +
        '<div class="lock-sub">Team Access Only</div>' +
        '<input type="password" id="amicusPw" placeholder="Enter team password" autocomplete="current-password"/>' +
        '<button id="amicusGo">Unlock</button>' +
        '<div class="lock-err" id="amicusErr"></div>' +
        '<div class="lock-note">This device will stay signed in.</div>' +
      '</div>';
    document.body.appendChild(wrap);

    var input = wrap.querySelector('#amicusPw');
    var err = wrap.querySelector('#amicusErr');

    async function attempt(){
      var val = input.value.trim();
      if (!val) return;
      var h;
      try { h = await sha256(val); }
      catch(e){ err.textContent = 'Unlock unavailable in this browser.'; return; }
      if (h === HASH){
        try { localStorage.setItem(KEY, HASH); } catch(e) {}
        document.documentElement.classList.remove('amicus-locked');
        wrap.remove();
      } else {
        err.textContent = 'Incorrect password. Please try again.';
        input.value = '';
        input.focus();
      }
    }

    wrap.querySelector('#amicusGo').addEventListener('click', attempt);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') attempt(); });
    setTimeout(function(){ input.focus(); }, 50);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildLock);
  } else {
    buildLock();
  }
})();
</script>
<!-- ===== AMICUS PASSWORD GATE (end) ===== -->

    .tip{margin-top:24px;border-radius:12px;padding:16px 18px;}
    .tip-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px;}
    .tip ul{padding-left:16px;font-size:13px;color:#555;line-height:2;}
    .goals{display:flex;flex-direction:column;gap:14px;}
    .gcard{background:white;border-radius:14px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
    .gcard-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
    .gcard-head .gi{font-size:20px;}
    .gcard-head .gn{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
    .gitems{display:flex;flex-direction:column;gap:16px;}
    .grow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px;}
    .glabel{font-size:14px;font-weight:600;color:#1a1a1a;flex:1;}
    .gcontrols{display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .gcount{font-size:13px;font-weight:700;color:#333;min-width:90px;text-align:center;}
    .gbtn{width:27px;height:27px;border-radius:7px;border:1px solid #E0E0E0;background:white;cursor:pointer;font-size:15px;font-weight:700;color:#666;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;line-height:1;flex-shrink:0;}
    .gtrack{height:8px;background:#F0F0F0;border-radius:99px;overflow:hidden;}
    .gfill{height:100%;border-radius:99px;transition:width 0.35s ease;}
    .gpct{text-align:right;font-size:11px;color:#AAA;margin-top:3px;}

// Safe key for Firebase (no special chars)
function safeKey(s){ return s.replace(/[^a-zA-Z0-9_]/g,'_'); }

function initFirebase(){
  const app = firebase.initializeApp({
    apiKey: "AIzaSyAU63lFT6Hs71oAHVV0aAixOqxFrhA6asc",
    authDomain: "amicus-marketing.firebaseapp.com",

    appId: "1:926415834204:web:c6824762be375a180dea99"
  });
  const db = firebase.database();
  dbRef = db.ref("portfolios/" + PORTFOLIO_KEY);

  // Listen for real-time changes from any user
  dbRef.on("value", (snapshot) => {
    const data = snapshot.val() || {};
    checked     = data.checked     || {};
    manualGoals = data.manualGoals || {};
    manualBonus = data.manualBonus || {};
    dbReady = true;
    render();
  });
}

function saveState(){
  if(!dbRef) return;
  dbRef.set({ checked, manualGoals, manualBonus });

function computeAutoGoals(){
  const counts={};
  schedule.forEach(day=>{
    day.tasks.forEach((t,i)=>{
      if(t.goalKey && checked[safeKey(`${day.day}-${i}`)]) {
        counts[t.goalKey]=(counts[t.goalKey]||0)+1;
      }
    });
  });
  return counts;
}

    b.textContent=s.day;
    b.onclick=()=>{activeDay=s.day;render();};
    el.appendChild(b);
  });
}

function renderGoalBar(cat,g,rawVal,key){
  const atTarget=rawVal>=g.target;
  const pct=atTarget?100:Math.min(99,Math.round((rawVal/g.target)*100));
  const bar=atTarget
    ?`linear-gradient(90deg,${cat.color},${cat.color}cc)`
    :`linear-gradient(90deg,${cat.color}99,${cat.color})`;
  const noteHtml=g.note?`<span style="font-size:11px;color:#AAA;margin-left:6px;">(${g.note})</span>`:"";
  let controls="";
  if(cat.manual){
    controls=`
      <button class="gbtn" onclick="adjManual('${safeKey(key)}',-1)">−</button>
      <span class="gcount" style="${atTarget?`color:${cat.color}`:""}">${rawVal} / ${g.target} ${g.unit}</span>
      <button class="gbtn" onclick="adjManual('${safeKey(key)}',1)" style="${atTarget?`background:${cat.color};color:white;border-color:${cat.color}`:""}">+</button>
      ${atTarget?`<span style="font-size:16px">✅</span>`:""}`;
  } else {
    if(atTarget){
      controls=`
        <button class="gbtn" onclick="adjBonus('${safeKey(key)}',-1)">−</button>
        <span class="gcount" style="color:${cat.color}">${rawVal} / ${g.target} ${g.unit}</span>
        <button class="gbtn" onclick="adjBonus('${safeKey(key)}',1)" style="background:${cat.color};color:white;border-color:${cat.color}">+</button>
        <span style="font-size:16px">✅</span>`;
    } else {
      controls=`<span class="gcount">${rawVal} / ${g.target} ${g.unit}</span>`;
    }
  }
  return `<div>
    <div class="grow-top"><span class="glabel">${g.label}${noteHtml}</span><div class="gcontrols">${controls}</div></div>
    <div class="gtrack"><div class="gfill" style="width:${pct}%;background:${bar}"></div></div>
    <div class="gpct${atTarget?" reached":""}" style="${atTarget?`color:${cat.color}`:""}">${atTarget?"Goal reached! 🎉":`${pct}%`}</div>
  </div>`;
}

  let html="";

  if(!dbReady){
    el.innerHTML=`<div style="text-align:center;padding:60px;color:#999;font-family:sans-serif;">🔄 Connecting to live database...</div>`;
    return;
  }

  if(!day.isGoals){
    const total=day.tasks.length;
    const done=day.tasks.filter((_,i)=>checked[safeKey(`${activeDay}-${i}`)]).length;
    const pct=total?Math.round((done/total)*100):0;
    html+=`<div class="sync-banner">🔴 Live — changes sync instantly for all users</div>`;
    html+=`<div class="prog-wrap"><div class="prog-meta"><span>${done} of ${total} tasks complete</span><span style="color:${ACCENT};font-weight:700">${pct}%</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${ACCENT}"></div></div></div><div class="tasks">`;
    day.tasks.forEach((t,i)=>{
      const key=safeKey(`${activeDay}-${i}`);
      const isDone=!!checked[key];
      const c=platformColors[t.platform]||"#888";
      html+=`<div class="task-card${isDone?" done":""}" style="border-left:4px solid ${c}" onclick="toggle('${key}')"><div class="checkbox" style="${isDone?`background:${ACCENT};border-color:${ACCENT}`:""}"><span class="ck">✓</span></div><div class="task-icon">${t.icon}</div><div class="task-body"><div class="plat-label" style="color:${c}">${t.platform}</div><div class="task-title">${t.task}</div>${t.detail?`<div class="task-detail">${t.detail}</div>`:""}${t.qtyGoal?`<div class="qty-row" onclick="event.stopPropagation()">How many? <select class="qty-select" onchange="setManual('${safeKey(t.qtyGoal)}',this.value)">${(()=>{const cur=manualGoals[safeKey(t.qtyGoal)]||0;let o='';for(let n=0;n<=t.qtyMax;n++){o+=`<option value="${n}"${n===cur?' selected':''}>${n}</option>`;}return o;})()}</select><span class="qty-of"> of ${t.qtyMax}</span></div>`:``}</div></div>`;
    });
    html+=`</div>`;
    if([].includes(activeDay)){html+=`<div class="tip" style="background:#FFFDE7;border:1px solid #FFE082"><div class="tip-title" style="color:#F9A825">⭐ Review Tactics</div><ul><li>Move-out helpers → hand QR code for review</li><li>Waiving something in rentroom → "Leave a 5-star with a paragraph about Amicus"</li><li>Doing a favor → ask for a review</li><li>Give maintenance staff QR codes</li><li>Follow up after turnover → request review if positive</li><li>Respond to <strong>every</strong> Google review</li></ul></div>`;}
    if([].includes(activeDay)){html+=`<div class="tip" style="background:#FFF3E0;border:1px solid #FFCC80"><div class="tip-title" style="color:#E65100">🧵 Reddit Format</div><ul><li>Use 2–4 accounts with credible post history</li><li>Keep conversation natural</li></ul></div>`;}
  } else {
    const autoCounts=computeAutoGoals();
    html+=`<div class="sync-banner">🔴 Live — updates instantly for all users</div>`;
    html+=`<p class="auto-note">Use +/− buttons on each goal to track progress · syncs instantly for all users</p><div class="goals">`;
    goalCategories.forEach(cat=>{
      html+=`<div class="gcard" style="border-left:4px solid ${cat.color}"><div class="gcard-head"><span class="gi">${cat.icon}</span><span class="gn" style="color:${cat.color}">${cat.platform}</span></div><div class="gitems">`;
      cat.goals.forEach(g=>{
        const key=`${cat.platform}|${g.label}`;
        const safeK=safeKey(key);
        let rawVal=cat.manual?(manualGoals[safeK]||0):((autoCounts[key]||0)+(manualBonus[safeK]||0));
        html+=renderGoalBar(cat,g,rawVal,safeK);
      });
      html+=`</div></div>`;
    });
    html+=`</div>`;
  }
  el.innerHTML=html;
}

function toggle(key){
  checked[key]=!checked[key];
  if(!checked[key]) delete checked[key];
  saveState();
}
function adjManual(key,d){
  manualGoals[key]=Math.max(0,(manualGoals[key]||0)+d);
  saveState();
}
function adjBonus(key,d){
  manualBonus[key]=Math.max(0,(manualBonus[key]||0)+d);
  saveState();
}
function setManual(goalKey,val){
  manualGoals[goalKey]=parseInt(val)||0;
  saveState();
  render();
}

// Init on load
initFirebase();

</script>
</body>
</html>
