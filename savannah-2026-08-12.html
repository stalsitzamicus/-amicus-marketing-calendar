<!-- ===== AMICUS PASSWORD GATE (start) ===== -->
<style id="amicusGateStyle">
  html.amicus-locked body > *:not(#amicusLock){display:none !important;}
  #amicusLock{position:fixed;inset:0;z-index:99999;background:#0f0f0f;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
  #amicusLock .lock-card{width:min(400px,90vw);text-align:center;padding:40px 32px;border:1px solid rgba(255,255,255,0.12);border-radius:16px;background:#161616;}
  #amicusLock .lock-mark{font-family:'Playfair Display',serif;font-weight:900;font-size:32px;color:#fff;letter-spacing:2px;}
  #amicusLock .lock-sub{color:rgba(255,255,255,0.55);font-size:13px;margin:6px 0 28px;letter-spacing:1px;text-transform:uppercase;}
  #amicusLock input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:#0f0f0f;color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:1px;}
  #amicusLock input:focus{border-color:rgba(255,255,255,0.5);}
  #amicusLock button{width:100%;margin-top:14px;padding:14px 16px;border-radius:10px;border:none;background:#fff;color:#0f0f0f;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
  #amicusLock button:hover{background:#e8e8e8;}
  #amicusLock .lock-err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:18px;}
  #amicusLock .lock-note{color:rgba(255,255,255,0.35);font-size:12px;margin-top:20px;}
</style>
<script id="amicusGateScript">
(function(){
  var KEY = 'amicus_auth_v1';
  var HASH = '576998560b830406a1a75b58651422a9d5dd7e09bec82310f52dc3200920a029';

  // Already unlocked on this device? Let the page load normally.
  try { if (localStorage.getItem(KEY) === HASH) return; } catch(e) {}

  document.documentElement.classList.add('amicus-locked');

  async function sha256(str){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }

  function buildLock(){
    var wrap = document.createElement('div');
    wrap.id = 'amicusLock';
    wrap.innerHTML =
      '<div class="lock-card">' +
        '<div class="lock-mark">AMICUS</div>' +
        '<div class="lock-sub">Team Access Only</div>' +
        '<input type="password" id="amicusPw" placeholder="Enter team password" autocomplete="current-password"/>' +
        '<button id="amicusGo">Unlock</button>' +
        '<div class="lock-err" id="amicusErr"></div>' +
        '<div class="lock-note">This device will stay signed in.</div>' +
      '</div>';
    document.body.appendChild(wrap);

    var input = wrap.querySelector('#amicusPw');
    var err = wrap.querySelector('#amicusErr');

    async function attempt(){
      var val = input.value.trim();
      if (!val) return;
      var h;
      try { h = await sha256(val); }
      catch(e){ err.textContent = 'Unlock unavailable in this browser.'; return; }
      if (h === HASH){
        try { localStorage.setItem(KEY, HASH); } catch(e) {}
        document.documentElement.classList.remove('amicus-locked');
        wrap.remove();
      } else {
        err.textContent = 'Incorrect password. Please try again.';
        input.value = '';
        input.focus();
      }
    }

    wrap.querySelector('#amicusGo').addEventListener('click', attempt);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') attempt(); });
    setTimeout(function(){ input.focus(); }, 50);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildLock);
  } else {
    buildLock();
  }
})();
</script>
<!-- ===== AMICUS PASSWORD GATE (end) ===== -->

    .task-card.done{opacity:0.42;box-shadow:none;}
    .checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #DDD;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:white;transition:all 0.2s;}
    .checkbox .ck{display:none;color:white;font-size:12px;font-weight:700;}
    .done .checkbox .ck{display:block;}
    .task-icon{font-size:21px;flex-shrink:0;margin-top:1px;}
    .task-body{flex:1;}
    .plat-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
    .task-title{font-size:15px;font-weight:600;color:#1a1a1a;}
    .done .task-title{text-decoration:line-through;}
    .task-detail{font-size:13px;color:#888;line-height:1.5;margin-top:3px;}
    .tip{margin-top:24px;border-radius:12px;padding:16px 18px;}
    .tip-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px;}
    .tip ul{padding-left:16px;font-size:13px;color:#555;line-height:2;}
    .goals{display:flex;flex-direction:column;gap:14px;}
    .gcard{background:white;border-radius:14px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
    .gcard-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
    .gcard-head .gi{font-size:20px;}
    .gcard-head .gn{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
    .gitems{display:flex;flex-direction:column;gap:16px;}
    .grow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px;}
    .glabel{font-size:14px;font-weight:600;color:#1a1a1a;flex:1;}
    .gcontrols{display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .gcount{font-size:13px;font-weight:700;color:#333;min-width:90px;text-align:center;}
    .gbtn{width:27px;height:27px;border-radius:7px;border:1px solid #E0E0E0;background:white;cursor:pointer;font-size:15px;font-weight:700;color:#666;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;line-height:1;flex-shrink:0;}
    .gtrack{height:8px;background:#F0F0F0;border-radius:99px;overflow:hidden;}
    .gfill{height:100%;border-radius:99px;transition:width 0.35s ease;}
    .gpct{text-align:right;font-size:11px;color:#AAA;margin-top:3px;}
    .gpct.reached{font-weight:700;}
    .auto-note{font-size:12px;color:#999;text-align:center;margin-bottom:20px;font-style:italic;}
    .sync-banner{background:#E8F5E9;border:1px solid #A5D6A7;border-radius:10px;padding:10px 16px;margin-bottom:20px;font-size:13px;color:#2E7D32;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:8px;}

    .header{background:linear-gradient(135deg,#1B5E20 0%,#2E7D32 60%,#388E3C 100%);}

function goalDonut(pct,color,atTarget){
  var r=15, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<div style="position:relative;width:46px;height:46px;flex-shrink:0;">'+
    '<svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate(-90deg);">'+
      '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="#ECECEC" stroke-width="5"/>'+
      '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" style="transition:stroke-dashoffset .45s ease"/>'+
    '</svg>'+
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:'+(atTarget?color:'#666')+';">'+(atTarget?'\u2713':pct+'%')+'</div>'+
  '</div>';
}
function renderGoalBar(cat,g,rawVal,key,isManual){
  const atTarget=rawVal>=g.target;
  const pct=atTarget?100:Math.min(99,Math.round((rawVal/g.target)*100));
  const bar=atTarget?`linear-gradient(90deg,${cat.color},${cat.color}cc)`:`linear-gradient(90deg,${cat.color}99,${cat.color})`;
  let controls="";
  if(isManual){
    controls=`<button class="gbtn" onclick="adjManual('${key}',-1)">−</button><span class="gcount" style="${atTarget?`color:${cat.color}`:''}">${rawVal} / ${g.target} ${g.unit}</span><button class="gbtn" onclick="adjManual('${key}',1)" style="${atTarget?`background:${cat.color};color:white;border-color:${cat.color}`:''}">+</button>${atTarget?'<span style="font-size:16px">✅</span>':''}`;
  } else if(atTarget){
    controls=`<button class="gbtn" onclick="adjBonus('${key}',-1)">−</button><span class="gcount" style="color:${cat.color}">${rawVal} / ${g.target} ${g.unit}</span><button class="gbtn" onclick="adjBonus('${key}',1)" style="background:${cat.color};color:white;border-color:${cat.color}">+</button><span style="font-size:16px">✅</span>`;
  } else {
    controls=`<span class="gcount">${rawVal} / ${g.target} ${g.unit}</span>`;
  }
  return `<div class="growwrap" style="display:flex;align-items:center;gap:14px;"><div style="flex:1;min-width:0;"><div class="grow-top"><span class="glabel">${g.label}</span><div class="gcontrols">${controls}</div></div><div class="gtrack"><div class="gfill" style="width:${pct}%;background:${bar}"></div></div><div class="gpct${atTarget?' reached':''}" style="${atTarget?`color:${cat.color}`:''}">${atTarget?'Goal reached! 🎉':`${pct}%`}</div></div>${goalDonut(pct,cat.color,atTarget)}</div>`;
}

function renderContent(){
  const el=document.getElementById("content");
  const day=schedule.find(s=>s.day===activeDay);
  if(!day)return;
  let html="";
  if(!dbReady){ el.innerHTML=`<div style="text-align:center;padding:60px;color:#999;font-family:sans-serif;">🔄 Connecting to live database...</div>`; return; }

  if(!day.isGoals){
    const total=day.tasks.length;
    const done=day.tasks.filter((_,i)=>checked[safeKey(`${activeDay}-${i}`)]).length;
    const pct=total?Math.round((done/total)*100):0;
    html+=`<div class="sync-banner">🔴 Live — changes sync instantly for all users</div>`;
    html+=`<div class="prog-wrap"><div class="prog-meta"><span>${done} of ${total} tasks complete</span><span style="color:${ACCENT};font-weight:700">${pct}%</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${ACCENT}"></div></div></div><div class="tasks">`;
    day.tasks.forEach((t,i)=>{
      const key=safeKey(`${activeDay}-${i}`);
      const isDone=!!checked[key];
      const c=platformColors[t.platform]||"#888";
      let extra="";
      if(t.qtyGoal){
        const gk=safeKey(t.qtyGoal); const cur=manualGoals[gk]||0;
        let opts=""; for(let n=0;n<=t.qtyMax;n++){opts+=`<option value="${n}"${n===cur?' selected':''}>${n}</option>`;}
        extra+=`<div class="qty-row" onclick="event.stopPropagation()">Running total: <select class="qty-select" onchange="setManual('${gk}',this.value)">${opts}</select><span class="qty-of"> of ${t.qtyMax}</span></div>`;
      }
      if(t.link){
        const lv=(taskLinks[key]||'').replace(/"/g,'&quot;');
        extra+=`<div class="qty-row" onclick="event.stopPropagation()" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><b style="font-weight:800">🔗 LINK:</b> <input type="url" placeholder="${(t.linkPlaceholder||'Paste link…')}" value="${lv}" onchange="setLink('${key}',this.value)" style="flex:1;min-width:0;padding:6px 10px;border:1px solid #ccc;border-radius:8px;font-size:13px;font-weight:700;"/>${taskLinks[key]?`<a href="${taskLinks[key]}" target="_blank" rel="noopener" style="font-size:13px;color:${ACCENT};font-weight:700;text-decoration:none;white-space:nowrap;">Open ↗</a>`:''}${jakeVerifyCtrl(key)}</div>`;
      }
      html+=`<div class="task-card${isDone?' done':''}" style="border-left:4px solid ${c}" onclick="toggle('${key}')"><div class="checkbox" style="${isDone?`background:${ACCENT};border-color:${ACCENT}`:''}"><span class="ck">✓</span></div><div class="task-icon">${t.icon}</div><div class="task-body"><div class="plat-label" style="color:${c}">${t.platform}</div><div class="task-title">${t.task}</div>${t.detail?`<div class="task-detail">${t.detail}</div>`:''}${extra}</div>${taskDonut(t,key,c)}</div>`;
    });
    html+=`</div>`;
    if(["Wed 8/12","Sat 8/15"].includes(activeDay)){html+=`<div class="tip" style="background:#FFFDE7;border:1px solid #FFE082"><div class="tip-title" style="color:#F9A825">⭐ Review Tactics</div><ul><li>Move-out helpers → hand QR code for review</li><li>Waiving something in rentroom → "Leave a 5-star with a paragraph about Amicus"</li><li>Doing a favor → ask for a review</li><li>Give maintenance staff QR codes</li><li>Follow up after turnover → request review if positive</li><li>Respond to <strong>every</strong> Google review</li></ul></div>`;}
    if(["Thu 8/13","Sun 8/16"].includes(activeDay)){html+=`<div class="tip" style="background:#FFF3E0;border:1px solid #FFCC80"><div class="tip-title" style="color:#E65100">🧵 Reddit Format</div><ul><li>Use 2–4 accounts with credible post history</li><li>Keep conversation natural</li></ul></div>`;}
  } else {
    const autoCounts=computeAutoGoals();
    html+=`<div class="sync-banner">🔴 Live — updates instantly for all users</div>`;
    html+=`<p class="auto-note">Check off tasks on each day and they roll up here automatically · dropdowns + / − buttons also sync live</p><div class="goals">`;
    goalCategories.forEach(cat=>{
      html+=`<div class="gcard" style="border-left:4px solid ${cat.color}"><div class="gcard-head"><span class="gi">${cat.icon}</span><span class="gn" style="color:${cat.color}">${cat.platform}</span></div><div class="gitems">`;
      cat.goals.forEach(g=>{
        const key=`${cat.platform}|${g.label}`; const safeK=safeKey(key);
        let rawVal,isManual;
        if(g.mode==="auto"){ rawVal=(autoCounts[key]||0)+(manualBonus[safeK]||0); isManual=false; }
        else { rawVal=(manualGoals[safeK]||0); isManual=true; }
        html+=renderGoalBar(cat,g,rawVal,safeK,isManual);
      });
      html+=`</div></div>`;
    });
    html+=`</div>`;
  }
  el.innerHTML=html; updateAllDoneGlow(!day.isGoals && day.tasks.length>0 && day.tasks.every((_,i)=>checked[safeKey(`${activeDay}-${i}`)]));
}

function toggle(key){ checked[key]=!checked[key]; if(!checked[key]) delete checked[key]; saveState(); }
function adjManual(key,d){ manualGoals[key]=Math.max(0,(manualGoals[key]||0)+d); saveState(); }
function adjBonus(key,d){ manualBonus[key]=Math.max(0,(manualBonus[key]||0)+d); saveState(); }
function setManual(goalKey,val){ manualGoals[goalKey]=parseInt(val)||0; saveState(); render(); }
function setLink(key,val){ val=(val||'').trim(); if(val){taskLinks[key]=val;} else {delete taskLinks[key];} saveState(); render(); }


function goalTargetFor(gk){
  for(var i=0;i<goalCategories.length;i++){ var cat=goalCategories[i];
    for(var j=0;j<cat.goals.length;j++){ if(cat.platform+'|'+cat.goals[j].label===gk) return cat.goals[j].target||1; } }
  return 1;
}
function taskPct(t,key){
  if(t.qtyGoal){ var gk=safeKey(t.qtyGoal); var cur=manualGoals[gk]||0; var mx=t.qtyMax||1; return Math.min(100,Math.round(cur/mx*100)); }
  if(t.goalKey){ var counts=computeAutoGoals(); var done=(counts[t.goalKey]||0); var tgt=goalTargetFor(t.goalKey); return Math.min(100,Math.round(done/tgt*100)); }
  return checked[key]?100:0;
}
function taskDonut(t,key,c){ var p=taskPct(t,key); return '<div style="margin-left:auto;align-self:center;padding-left:8px;">'+goalDonut(p,c,p>=100)+'</div>'; }
function jakeVerifyCtrl(key){
  var q=String.fromCharCode(39);
  var ver=!!taskVerify[key];
  var box='<span style="width:18px;height:18px;border-radius:5px;border:2px solid '+(ver?'#2e7d32':(jakeMode?'#bbb':'#ddd'))+';background:'+(ver?'#2e7d32':(jakeMode?'#fff':'#f3f3f3'))+';color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;">'+(ver?'\u2713':'')+'</span>';
  var label='<b style="font-weight:800;color:'+(ver?'#2e7d32':(jakeMode?'#777':'#aaa'))+';">J</b>';
  if(jakeMode){
    return '<span onclick="event.stopPropagation();setVerify('+q+key+q+')" title="Jake: mark as seen / done" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;">'+box+label+'</span>';
  }
  return '<span title="Only Jake can check this" style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap;">'+box+label+'</span>';
}
function setVerify(key){ if(!jakeMode) return; if(taskVerify[key]) delete taskVerify[key]; else taskVerify[key]=true; saveState(); render(); }
var allDoneState={};
function dropConfetti(){
  var host=document.getElementById('confettiHost');
  if(!host){ host=document.createElement('div'); host.id='confettiHost';
    host.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden;';
    document.body.appendChild(host); }
  var tb=document.querySelector('.tabs-bar');
  var startY=tb?Math.round(tb.getBoundingClientRect().bottom):60;
  var colors=['#4CAF50','#81C784','#FFD54F','#FFFFFF','#2E7D32',ACCENT];
  for(var i=0;i<90;i++){
    var d=document.createElement('div');
    var size=6+Math.random()*8;
    var col=colors[Math.floor(Math.random()*colors.length)];
    var dur=2200+Math.random()*1600, delay=Math.random()*250, rot=Math.random()*360, xdrift=Math.random()*160-80;
    d.style.cssText='position:absolute;top:'+startY+'px;left:'+(Math.random()*100)+'vw;width:'+size+'px;height:'+(size*0.5)+'px;background:'+col+';border-radius:1px;';
    host.appendChild(d);
    var anim=d.animate([
      {transform:'translate(0,0) rotate('+rot+'deg)',opacity:1},
      {transform:'translate('+xdrift+'px,'+(window.innerHeight+40)+'px) rotate('+(rot+720)+'deg)',opacity:1,offset:0.85},
      {transform:'translate('+xdrift+'px,'+(window.innerHeight+90)+'px) rotate('+(rot+800)+'deg)',opacity:0}
    ],{duration:dur,delay:delay,easing:'cubic-bezier(.22,.6,.36,1)',fill:'forwards'});
    anim.onfinish=(function(el){return function(){el.remove();};})(d);
  }
  setTimeout(function(){ if(host) host.innerHTML=''; },4400);
}
function updateAllDoneGlow(on){
  var g=document.getElementById('allDoneGlow');
  if(!g){ g=document.createElement('div'); g.id='allDoneGlow';
    g.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9990;opacity:0;transition:opacity 1.1s ease;background:rgba(76,175,80,0.09);';
    document.body.appendChild(g);
  }
  var prev=allDoneState[activeDay];
  var justDone=(prev!==undefined && !prev && on);
  allDoneState[activeDay]=on;
  if(justDone){ dropConfetti(); var d=activeDay; setTimeout(function(){ if(activeDay===d) g.style.opacity='1'; },450); }
  else { g.style.opacity=on?'1':'0'; }
}

initFirebase();

</script>
