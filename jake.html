<!DOCTYPE html>
<html lang="en">
<head>
<!-- ===== JAKE PRIVATE GATE (start) ===== -->
<style id="jakeGateStyle">
  html.jake-locked body > *:not(#jakeLock){display:none !important;}
  #jakeLock{position:fixed;inset:0;z-index:99999;background:#0f0f0f;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
  #jakeLock .lock-card{width:min(400px,90vw);text-align:center;padding:40px 32px;border:1px solid rgba(255,255,255,0.12);border-radius:16px;background:#161616;}
  #jakeLock .lock-mark{font-family:'Playfair Display',serif;font-weight:900;font-size:32px;color:#fff;letter-spacing:2px;}
  #jakeLock .lock-sub{color:rgba(255,255,255,0.55);font-size:13px;margin:6px 0 28px;letter-spacing:1px;text-transform:uppercase;}
  #jakeLock input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:#0f0f0f;color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:1px;}
  #jakeLock input:focus{border-color:rgba(255,255,255,0.5);}
  #jakeLock button{width:100%;margin-top:14px;padding:14px 16px;border-radius:10px;border:none;background:#fff;color:#0f0f0f;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
  #jakeLock button:hover{background:#e8e8e8;}
  #jakeLock .lock-err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:18px;}
  #jakeLock .lock-note{color:rgba(255,255,255,0.35);font-size:12px;margin-top:20px;}
</style>
<script id="jakeGateScript">
(function(){
  var KEY = 'amicus_jake_v1';
  var HASH = 'e7cf3ef4f17c3999a94f2c6f612e8a888e5b1026878e4e19398b23bd38ec221a';
  try { if (localStorage.getItem(KEY) === HASH) return; } catch(e) {}
  document.documentElement.classList.add('jake-locked');
  async function sha256(str){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }
  function buildLock(){
    var wrap = document.createElement('div');
    wrap.id = 'jakeLock';
    wrap.innerHTML =
      '<div class="lock-card">' +
        '<div class="lock-mark">JAKE</div>' +
        '<div class="lock-sub">Private — Jake Only</div>' +
        '<input type="password" id="jakePw" placeholder="Enter password" autocomplete="current-password"/>' +
        '<button id="jakeGo">Unlock</button>' +
        '<div class="lock-err" id="jakeErr"></div>' +
        '<div class="lock-note">This device will stay signed in.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var input = wrap.querySelector('#jakePw');
    var err = wrap.querySelector('#jakeErr');
    async function attempt(){
      var val = input.value.trim();
      if (!val) return;
      var h;
      try { h = await sha256(val); }
      catch(e){ err.textContent = 'Unlock unavailable in this browser.'; return; }
      if (h === HASH){
        try { localStorage.setItem(KEY, HASH); } catch(e) {}
        document.documentElement.classList.remove('jake-locked');
        wrap.remove();
      } else {
        err.textContent = 'Incorrect password. Please try again.';
        input.value = ''; input.focus();
      }
    }
    wrap.querySelector('#jakeGo').addEventListener('click', attempt);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') attempt(); });
    setTimeout(function(){ input.focus(); }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', buildLock);
  else buildLock();
})();
</script>
<!-- ===== JAKE PRIVATE GATE (end) ===== -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jake — Private</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;}
    .wrap{max-width:820px;margin:0 auto;padding:28px 22px 80px;}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
    a.back{font-size:12px;color:rgba(255,255,255,0.5);text-decoration:none;letter-spacing:1px;text-transform:uppercase;}
    a.back:hover{color:#fff;}
    button.signout{background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;}
    button.signout:hover{color:#fff;border-color:rgba(255,255,255,0.5);}
    h1{font-family:'Playfair Display',serif;font-size:34px;font-weight:900;letter-spacing:1px;margin:14px 0 2px;}
    .sub{font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase;margin-bottom:22px;}
    .sync{font-size:12px;color:#81C784;margin-bottom:20px;display:flex;align-items:center;gap:7px;}
    .section{margin-bottom:30px;}
    .section h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:4px;}
    .section .shint{font-size:12px;color:rgba(255,255,255,0.35);margin-bottom:14px;}
    .item{background:#161616;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:13px 16px;display:flex;gap:13px;align-items:flex-start;cursor:pointer;margin-bottom:9px;transition:opacity .2s;}
    .item.done{opacity:0.45;}
    .cb{width:22px;height:22px;border-radius:6px;border:2px solid #555;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:#0f0f0f;color:#fff;font-size:12px;font-weight:700;}
    .item.done .cb{background:#4CAF50;border-color:#4CAF50;}
    .cb .tick{display:none;} .item.done .cb .tick{display:block;}
    .it-body .t{font-size:15px;font-weight:600;}
    .item.done .t{text-decoration:line-through;}
    .it-body .d{font-size:12.5px;color:rgba(255,255,255,0.45);margin-top:3px;line-height:1.5;}
    /* grouped item with mini-checks */
    .item-group{background:#161616;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 16px;margin-bottom:9px;}
    .item-group .t{font-size:15px;font-weight:600;}
    .item-group .d{font-size:12.5px;color:rgba(255,255,255,0.45);margin-top:3px;line-height:1.5;}
    .subs{margin:12px 0 2px;display:flex;flex-direction:column;gap:8px;}
    .subitem{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px;}
    .subcb{width:18px;height:18px;border-radius:5px;border:2px solid #555;background:#0f0f0f;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;font-weight:700;}
    .subitem.done .subcb{background:#4CAF50;border-color:#4CAF50;}
    .subitem.done .sublabel{text-decoration:line-through;opacity:0.5;}
    .link-row{margin:-2px 0 11px;display:flex;gap:8px;align-items:center;}
    .link-row input{flex:1;min-width:0;padding:8px 11px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:#0f0f0f;color:#fff;font-size:13px;outline:none;}
    .link-row input:focus{border-color:rgba(255,255,255,0.45);}
    .link-row a{font-size:13px;color:#81C784;font-weight:700;text-decoration:none;white-space:nowrap;}
    .note-card{background:#161616;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
    .note-card .nm{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;margin-bottom:8px;}
    textarea{width:100%;min-height:80px;background:#0f0f0f;border:1px solid rgba(255,255,255,0.14);border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:13.5px;line-height:1.6;padding:10px 12px;resize:vertical;outline:none;}
    textarea:focus{border-color:rgba(255,255,255,0.4);}
    .saved{font-size:11px;color:#81C784;margin-top:5px;height:14px;letter-spacing:1px;text-transform:uppercase;}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="amicus-marketing-hub.html">← Back to Hub</a>
    <button class="signout" id="signout">Sign out this device</button>
  </div>
  <h1>Jake</h1>
  <div class="sub">Private workspace</div>
  <div class="sync" id="sync">⏳ Connecting…</div>

  <div class="section" id="checklistSection">
    <h2>To-do</h2>
    <div class="shint">Tap to check off. Syncs across your devices.</div>
    <div id="checklist"></div>
  </div>

  <div class="section">
    <h2>Market check-ins</h2>
    <div class="shint">Thursday &amp; Monday AM — jot what each market has done, is missing, and needs to do next.</div>
    <div id="notes"></div>
  </div>
</div>

<script>
const PKEY = "jake-private";
const checklist = [
  {id:"insta_tulane", t:"Create Tulane Instagram", d:"Stand up the @amicus Tulane account (Tulane still on hold, but reserve the handle)."},
  {id:"insta_charleston", t:"Create Charleston Instagram", d:"Charleston is now active — get its Instagram live."},
  {id:"google_suites", t:"Get login for all Google Suites", d:"Confirm working access to every market's Google Workspace.", subs:[
    {id:"gs_lehigh",label:"Lehigh"},{id:"gs_savannah",label:"Savannah"},{id:"gs_charleston",label:"Charleston"},
    {id:"gs_binghamton",label:"Binghamton"},{id:"gs_troy",label:"Troy"},{id:"gs_tulane",label:"Tulane"}]},
  {id:"reddit_logins", t:"Note down all new Reddit logins", d:"Track which accounts exist (keep actual passwords in your password manager). Jot the account handles / notes below.", notes:true},
  {id:"buy_followers", t:"Buy followers for all Instagrams", d:"Heads-up: this breaks Instagram's ToS and IG purges fake followers / can flag or suspend accounts. Organic local growth is safer — reconsider before spending."},
  {id:"verify_insta", t:"Get verified for all Instagrams", d:"Apply for Meta verification on each market account."},
  {id:"logins_everything", t:"GATHER logins for EVERYTHING", d:"Pull every account login into one place (a password manager vault)."},
  {id:"checkins", t:"Check in with each market — Thu & Mon AM", d:"Record progress, gaps, and next steps in the market notes below.", subs:[
    {id:"ci_savannah",label:"Savannah"},{id:"ci_charleston",label:"Charleston"},
    {id:"ci_binghamton",label:"Binghamton"},{id:"ci_troy",label:"Troy"}]}
];
const markets = ["Lehigh","Savannah","Charleston","Binghamton","Troy","Tulane"];

let state = {checked:{}, notes:{}, links:{}, itemNotes:{}};
let dbRef = null, saveTimer = null;

function esc(v){return (v||'').replace(/"/g,'&quot;');}

function initFirebase(){
  firebase.initializeApp({
    apiKey: "AIzaSyAU63lFT6Hs71oAHVV0aAixOqxFrhA6asc",
    authDomain: "amicus-marketing.firebaseapp.com",
    databaseURL: "https://amicus-marketing-default-rtdb.firebaseio.com",
    projectId: "amicus-marketing",
    storageBucket: "amicus-marketing.firebasestorage.app",
    messagingSenderId: "926415834204",
    appId: "1:926415834204:web:c6824762be375a180dea99"
  });
  dbRef = firebase.database().ref("portfolios/" + PKEY);
  dbRef.on("value", (snap)=>{
    const d = snap.val() || {};
    state.checked = d.checked || {};
    state.notes   = d.notes   || {};
    state.links   = d.links   || {};
    state.itemNotes = d.itemNotes || {};
    document.getElementById('sync').innerHTML = "✅ Synced";
    render();
  }, ()=>{ document.getElementById('sync').innerHTML = "⚠️ Offline (changes may not save)"; });
}
function save(){ if(dbRef) dbRef.set({checked:state.checked, notes:state.notes, links:state.links, itemNotes:state.itemNotes}); }
function queueSave(el){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ save(); if(el){ el.textContent="Saved"; setTimeout(()=>el.textContent="",1400);} }, 500);
}

function render(){
  const cl = document.getElementById('checklist');
  const _ae=document.activeElement; let _fNote=null,_fCaret=0;
  if(_ae && _ae.tagName==='TEXTAREA' && _ae.getAttribute('data-noteid')){ _fNote=_ae.getAttribute('data-noteid'); _fCaret=_ae.selectionStart; }
  cl.innerHTML = "";
  checklist.forEach(item=>{
    if(item.subs){
      const g = document.createElement('div');
      g.className = "item-group";
      const subsHtml = item.subs.map(sub=>{
        const done = !!state.checked[sub.id];
        return `<div class="subitem${done?' done':''}" data-sid="${sub.id}"><div class="subcb">${done?'✓':''}</div><div class="sublabel">${sub.label}</div></div>`;
      }).join("");
      g.innerHTML = `<div class="t">${item.t}</div><div class="d">${item.d}</div><div class="subs">${subsHtml}</div>`;
      g.querySelectorAll('.subitem').forEach(el=>{
        el.addEventListener('click', ()=>{
          const sid = el.getAttribute('data-sid');
          if(state.checked[sid]) delete state.checked[sid]; else state.checked[sid]=true;
          render(); save();
        });
      });
      cl.appendChild(g);
    } else {
      const done = !!state.checked[item.id];
      const div = document.createElement('div');
      div.className = "item" + (done?" done":"");
      div.innerHTML = '<div class="cb"><span class="tick">✓</span></div><div class="it-body"><div class="t"></div><div class="d"></div></div>';
      div.querySelector('.t').textContent = item.t;
      div.querySelector('.d').textContent = item.d;
      div.addEventListener('click', ()=>{
        if(state.checked[item.id]) delete state.checked[item.id]; else state.checked[item.id]=true;
        render(); save();
      });
      cl.appendChild(div);
      if(item.link){
        const lv = state.links[item.id] || "";
        const lr = document.createElement('div');
        lr.className = "link-row";
        lr.innerHTML = `🔗 <input type="url" placeholder="Paste link…" value="${esc(lv)}"/>${lv?`<a href="${esc(lv)}" target="_blank" rel="noopener">Open ↗</a>`:''}`;
        const inp = lr.querySelector('input');
        inp.addEventListener('click', e=>e.stopPropagation());
        inp.addEventListener('change', ()=>{
          const v = inp.value.trim();
          if(v) state.links[item.id]=v; else delete state.links[item.id];
          save(); render();
        });
        cl.appendChild(lr);
      }
      if(item.notes){
        const nb=document.createElement('div'); nb.style.cssText="margin:-2px 0 12px;";
        const ta=document.createElement('textarea'); ta.setAttribute('data-noteid',item.id); ta.placeholder="Notes…"; ta.value=state.itemNotes[item.id]||"";
        const sv=document.createElement('div'); sv.className="saved";
        ta.addEventListener('input',()=>{ state.itemNotes[item.id]=ta.value; queueSave(sv); });
        nb.appendChild(ta); nb.appendChild(sv); cl.appendChild(nb);
      }
    }
  });

  if(_fNote){ const _el=cl.querySelector('textarea[data-noteid="'+_fNote+'"]'); if(_el){ _el.focus(); try{_el.setSelectionRange(_fCaret,_fCaret);}catch(e){} } }

  const nc = document.getElementById('notes');
  if(nc.children.length === 0){
    markets.forEach(m=>{
      const card = document.createElement('div');
      card.className = "note-card";
      card.innerHTML = '<div class="nm"></div><textarea placeholder="Done / missing / next steps…"></textarea><div class="saved"></div>';
      card.querySelector('.nm').textContent = m;
      const ta = card.querySelector('textarea');
      const saved = card.querySelector('.saved');
      ta.value = state.notes[m] || "";
      ta.addEventListener('input', ()=>{ state.notes[m] = ta.value; queueSave(saved); });
      nc.appendChild(card);
    });
  } else {
    markets.forEach((m,i)=>{
      const ta = nc.children[i].querySelector('textarea');
      if(document.activeElement !== ta && (state.notes[m]||"") !== ta.value){ ta.value = state.notes[m] || ""; }
    });
  }
}

document.getElementById('signout').addEventListener('click', ()=>{
  try{ localStorage.removeItem('amicus_jake_v1'); }catch(e){}
  location.reload();
});

initFirebase();
render();
</script>
</body>
