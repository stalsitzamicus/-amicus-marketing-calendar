<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Binghamton — Amicus Marketing Checklist</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:#F7F5F2;min-height:100vh;}

    .header{background:linear-gradient(135deg,#1B5E20 0%,#2E7D32 60%,#388E3C 100%);padding:36px 32px 28px;color:white;}
    .header .inner{max-width:900px;margin:0 auto;}
    .header .back{font-size:12px;color:rgba(255,255,255,0.5);text-decoration:none;letter-spacing:1px;text-transform:uppercase;display:inline-block;margin-bottom:16px;}
    .header .back:hover{color:white;}
    .header .top-row{display:flex;align-items:center;gap:16px;margin-bottom:6px;}
    .header .logo-wrap{width:52px;height:52px;border-radius:10px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
    .header h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;}
    .header .meta{font-size:12px;color:rgba(255,255,255,0.55);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}

    .tabs-bar{background:#145214;padding:0 32px;overflow-x:auto;}
    .tabs{max-width:900px;margin:0 auto;display:flex;}
    .tab{background:transparent;color:rgba(255,255,255,0.5);border:none;padding:13px 16px;font-size:13px;font-weight:400;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
    .tab.active{background:#F7F5F2;color:#1B5E20;font-weight:700;}

    .content{max-width:900px;margin:0 auto;padding:28px 32px;}

    /* Progress */
    .prog-wrap{margin-bottom:24px;}
    .prog-meta{display:flex;justify-content:space-between;font-size:13px;color:#666;margin-bottom:7px;}
    .prog-track{height:6px;background:#E0E0E0;border-radius:99px;overflow:hidden;}
    .prog-fill{height:100%;border-radius:99px;transition:width 0.4s ease;}

    /* Tasks */
    .tasks{display:flex;flex-direction:column;gap:11px;}
    .task-card{background:white;border-radius:12px;padding:15px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;transition:opacity 0.2s,box-shadow 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
    .task-card.done{opacity:0.42;box-shadow:none;}
    .checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #DDD;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:white;transition:all 0.2s;}
    .checkbox .ck{display:none;color:white;font-size:12px;font-weight:700;}
    .done .checkbox .ck{display:block;}
    .task-icon{font-size:21px;flex-shrink:0;margin-top:1px;}
    .task-body{flex:1;}
    .plat-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
    .task-title{font-size:15px;font-weight:600;color:#1a1a1a;}
    .done .task-title{text-decoration:line-through;}
    .task-detail{font-size:13px;color:#888;line-height:1.5;margin-top:3px;}

    /* Tip boxes */
    .tip{margin-top:24px;border-radius:12px;padding:16px 18px;}
    .tip-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px;}
    .tip ul{padding-left:16px;font-size:13px;color:#555;line-height:2;}

    /* Goals */
    .goals{display:flex;flex-direction:column;gap:14px;}
    .gcard{background:white;border-radius:14px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
    .gcard-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
    .gcard-head .gi{font-size:20px;}
    .gcard-head .gn{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
    .gitems{display:flex;flex-direction:column;gap:13px;}
    .grow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
    .glabel{font-size:14px;font-weight:600;color:#1a1a1a;}
    .gcontrols{display:flex;align-items:center;gap:7px;}
    .gbtn{width:27px;height:27px;border-radius:7px;border:1px solid #E0E0E0;background:white;cursor:pointer;font-size:15px;font-weight:700;color:#666;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;line-height:1;}
    .gcount{font-size:13px;font-weight:700;min-width:80px;text-align:center;color:#333;}
    .gtrack{height:8px;background:#F0F0F0;border-radius:99px;overflow:hidden;}
    .gfill{height:100%;border-radius:99px;transition:width 0.35s ease;}
    .gpct{text-align:right;font-size:11px;color:#AAA;margin-top:3px;}
    .gpct.reached{font-weight:700;}
  </style>
</head>
<body>

<div class="header">
  <div class="inner">
    <a class="back" href="amicus-marketing-hub.html">← Back to Hub</a>
    <div class="top-row">
      <div class="logo-wrap">🟢</div>
      <div>
        <h1>Binghamton</h1>
        <div class="meta">Binghamton University · May 20 – 26, 2026</div>
      </div>
    </div>
  </div>
</div>

<div class="tabs-bar"><div class="tabs" id="tabs"></div></div>
<div class="content" id="content"></div>

<script>
const ACCENT = "#2E7D32";
const platformColors={"Instagram":"#E1306C","Facebook":"#1877F2","Reddit":"#FF4500","Google Reviews":"#FBBC04","Google Uploads":"#34A853","Google Posts":"#4285F4","Website":"#00BCD4"};

const goalCategories=[
  {platform:"Google Uploads",icon:"🖼️",color:"#34A853",goals:[{label:"Photos uploaded",target:10,unit:"photos"},{label:"Videos uploaded",target:2,unit:"videos"}]},
  {platform:"Google Posts",icon:"📌",color:"#4285F4",goals:[{label:"Google Posts published",target:3,unit:"posts"}]},
  {platform:"Google Reviews",icon:"⭐",color:"#FBBC04",goals:[{label:"New Google reviews earned",target:10,unit:"reviews"}]},
  {platform:"Reddit",icon:"🧵",color:"#FF4500",goals:[{label:"Reddit meetings held",target:1,unit:"meetings"},{label:"New Reddit threads started",target:1,unit:"threads"}]},
  {platform:"Instagram",icon:"📸",color:"#E1306C",goals:[{label:"Instagram posts published",target:2,unit:"posts"}]},
  {platform:"Facebook",icon:"👥",color:"#1877F2",goals:[{label:"Facebook posts made",target:2,unit:"posts"},{label:"Facebook DM outreach sessions",target:1,unit:"sessions"}]},
];

const schedule=[
  {day:"Wed 5/20",tasks:[
    {platform:"Instagram",icon:"📸",task:"Gather content for the week",detail:"Photos, videos, captions — plan ahead. Put in a OneDrive folder and share with Jake."},
    {platform:"Reddit",icon:"🧵",task:"Start a new Reddit thread",detail:"Fresh topic — brainstorm angle with team"},
    {platform:"Facebook",icon:"👥",task:"DM outreach on Facebook",detail:"Engage prospects, respond to messages"},
    {platform:"Website",icon:"🌐",task:"Website content prep",detail:"Make a OneDrive folder and tag Jake. Add: testimonial section, videos, events, photos."},
  ]},
  {day:"Thu 5/21",tasks:[
    {platform:"Google Uploads",icon:"🖼️",task:"Upload photos to Google page",detail:"Target: 5–6 photos toward weekly goal of 10+"},
    {platform:"Google Uploads",icon:"🎬",task:"Upload videos to Google page",detail:"1–2 videos toward weekly goal"},
    {platform:"Google Posts",icon:"📌",task:"Google Post #1",detail:"Highlight: past event, renovated house, or leasing"},
  ]},
  {day:"Fri 5/22",tasks:[
    {platform:"Google Reviews",icon:"⭐",task:"End-of-week review push",detail:"Move-out QR push, wave favors → ask for review, respond to all reviews"},
    {platform:"Google Posts",icon:"📌",task:"Google Post #2",detail:"Highlight: house under construction, move-out, or brainstorm pick"},
  ]},
  {day:"Sat 5/23",tasks:[
    {platform:"Google Reviews",icon:"⭐",task:"Respond to all new Google reviews",detail:"Every review — with or without text"},
    {platform:"Google Uploads",icon:"🖼️",task:"Finish photo uploads",detail:"Hit 10+ photo goal for the week"},
  ]},
  {day:"Sun 5/24",tasks:[
    {platform:"Google Reviews",icon:"⭐",task:"Review check & follow-ups",detail:"Follow up after turnovers, check in on move-ins, ask for reviews if positive"},
  ]},
  {day:"Mon 5/25",tasks:[
    {platform:"Reddit",icon:"🧵",task:"Reddit meeting",detail:"2–4 credible accounts making conversation in existing threads"},
    {platform:"Google Posts",icon:"📌",task:"Google Post #3",detail:"End-of-week post — leasing, renovation, or BRAINSTORM pick"},
    {platform:"Google Reviews",icon:"⭐",task:"Mid-week review push",detail:"Give maintenance QR codes, follow up on recent move-ins"},
  ]},
  {day:"Tue 5/26",tasks:[
    {platform:"Google Uploads",icon:"🖼️",task:"Any remaining photo/video uploads",detail:"Make sure 10+ photos and 1–2 videos are hit before week closes"},
    {platform:"Google Reviews",icon:"⭐",task:"Respond to any remaining reviews",detail:"Close out the week — no review left unanswered"},
  ]},
  {day:"📊 Goals",isGoals:true,tasks:[]},
];

let activeDay="Wed 5/20";
const checked={};
const goalValues={};
goalCategories.forEach(c=>c.goals.forEach(g=>{goalValues[`${c.platform}-${g.label}`]=0;}));

function render(){renderTabs();renderContent();}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML="";
  schedule.forEach(s=>{
    const b=document.createElement("button");
    b.className="tab"+(s.day===activeDay?" active":"");
    b.textContent=s.day;
    b.onclick=()=>{activeDay=s.day;render();};
    el.appendChild(b);
  });
}

function renderContent(){
  const el=document.getElementById("content");
  const day=schedule.find(s=>s.day===activeDay);
  if(!day)return;
  let html="";

  if(!day.isGoals){
    const total=day.tasks.length;
    const done=day.tasks.filter((_,i)=>checked[`${activeDay}-${i}`]).length;
    const pct=total?Math.round((done/total)*100):0;
    html+=`<div class="prog-wrap"><div class="prog-meta"><span>${done} of ${total} tasks complete</span><span style="color:${ACCENT};font-weight:700">${pct}%</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${ACCENT}"></div></div></div><div class="tasks">`;
    day.tasks.forEach((t,i)=>{
      const key=`${activeDay}-${i}`;const isDone=!!checked[key];const c=platformColors[t.platform]||"#888";
      html+=`<div class="task-card${isDone?" done":""}" style="border-left:4px solid ${c}" onclick="toggle('${key}')"><div class="checkbox" style="${isDone?`background:${ACCENT};border-color:${ACCENT}`:""}"><span class="ck">✓</span></div><div class="task-icon">${t.icon}</div><div class="task-body"><div class="plat-label" style="color:${c}">${t.platform}</div><div class="task-title">${t.task}</div>${t.detail?`<div class="task-detail">${t.detail}</div>`:""}</div></div>`;
    });
    html+=`</div>`;
    if(["Fri 5/22","Mon 5/25","Sun 5/24"].includes(activeDay)){html+=`<div class="tip" style="background:#FFFDE7;border:1px solid #FFE082"><div class="tip-title" style="color:#F9A825">⭐ Review Tactics Reminder</div><ul><li>Move-out helpers → hand QR code for review</li><li>Waiving something in rentroom → "Leave a 5-star with a paragraph about Amicus"</li><li>Doing a favor → ask for a review</li><li>Give maintenance staff QR codes</li><li>Follow up after turnover → request review if positive</li><li>Respond to <strong>every</strong> Google review</li></ul></div>`;}
    if(["Wed 5/20","Mon 5/25"].includes(activeDay)){html+=`<div class="tip" style="background:#FFF3E0;border:1px solid #FFCC80"><div class="tip-title" style="color:#E65100">🧵 Reddit Format</div><ul><li>Use 2–4 accounts with credible post history</li><li>Keep conversation natural — don't make it feel like an ad</li><li>Start fresh thread Wednesday, hold meeting Monday</li></ul></div>`;}
  } else {
    html+=`<div class="goals">`;
    goalCategories.forEach(cat=>{
      html+=`<div class="gcard" style="border-left:4px solid ${cat.color}"><div class="gcard-head"><span class="gi">${cat.icon}</span><span class="gn" style="color:${cat.color}">${cat.platform}</span></div><div class="gitems">`;
      cat.goals.forEach(g=>{
        const key=`${cat.platform}-${g.label}`;const val=goalValues[key]||0;const pct=Math.min(100,Math.round((val/g.target)*100));const done=val>=g.target;
        const bar=done?`linear-gradient(90deg,${cat.color},${cat.color}cc)`:`linear-gradient(90deg,${cat.color}99,${cat.color})`;
        html+=`<div><div class="grow-top"><span class="glabel">${g.label}</span><div class="gcontrols"><button class="gbtn" onclick="adj('${key}',-1,${g.target})">−</button><span class="gcount" style="${done?`color:${cat.color}`:""}">${val} / ${g.target} ${g.unit}</span><button class="gbtn" onclick="adj('${key}',1,${g.target})" style="${done?`background:${cat.color};color:white;border-color:${cat.color}`:""}">+</button>${done?`<span>✅</span>`:""}</div></div><div class="gtrack"><div class="gfill" style="width:${pct}%;background:${bar}"></div></div><div class="gpct${done?" reached":""}" style="${done?`color:${cat.color}`:""}">${done?"Goal reached! 🎉":`${pct}%`}</div></div>`;
      });
      html+=`</div></div>`;
    });
    html+=`</div>`;
  }
  el.innerHTML=html;
}

function toggle(key){checked[key]=!checked[key];render();}
function adj(key,d,max){goalValues[key]=Math.min(max,Math.max(0,(goalValues[key]||0)+d));render();}
render();
</script>
</body>
</html>
